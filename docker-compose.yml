# Start Testbench:  docker compose up -d     then open http://localhost:4100
#
# As shipped it is reachable only from this computer (the port is published on 127.0.0.1) and has no login.
# To let other people reach it, see "Running it for a team" in the README: set TESTBENCH_PASSWORD, publish the port
# without the 127.0.0.1 prefix (or put it behind an HTTPS reverse proxy) and list your domain in TESTBENCH_ALLOWED_HOSTS.
services:
  testbench:
    build: .
    image: testbench:latest
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      # Values come from a git-ignored .env file next to this one (copy .env.example). Never put secrets in this file.
      TESTBENCH_ALLOW_NO_AUTH: "${TESTBENCH_ALLOW_NO_AUTH:-1}"   # safe only while the port above is published on 127.0.0.1
      TESTBENCH_PASSWORD: "${TESTBENCH_PASSWORD:-}"
      TESTBENCH_ALLOWED_HOSTS: "${TESTBENCH_ALLOWED_HOSTS:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"   # for importing GitHub Actions runs
    volumes:
      - testbench-data:/data
    restart: unless-stopped

volumes:
  testbench-data:
