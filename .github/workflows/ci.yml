name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TestPilot's Python tools (API test runner, package builder) and their tests: standard library only, no network (an in-process mock server).
  testpilot:
    name: TestPilot (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s testpilot/tests

  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Example of reporting test results to a Testbench instance (see docs/ci-integration.md and examples/github-actions/).
      # This repository has no Playwright suite of its own, so the step is skipped unless test-results/results.json exists;
      # it needs the secrets TESTBENCH_URL and TESTBENCH_API_TOKEN and the variable TESTBENCH_PROJECT_ID, and it never fails the build.
      - name: Report test results to Testbench
        if: always() && hashFiles('test-results/results.json') != ''
        env:
          TESTBENCH_URL: ${{ secrets.TESTBENCH_URL }}
          TESTBENCH_PROJECT_ID: ${{ vars.TESTBENCH_PROJECT_ID }}
          TESTBENCH_API_TOKEN: ${{ secrets.TESTBENCH_API_TOKEN }}
        run: node scripts/ci-report.mjs test-results/results.json
      # Known vulnerabilities in what ships. Reported but not blocking: a new advisory should not fail an unrelated change.
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # What the pages look like in a real browser: text contrast in dark and light (WCAG AA), and the layout at different screen
  # widths. Uses the Chrome that GitHub's runners already have.
  # These checks are opt-in: they take a long time and only mean something when something visual changed. scripts/changed-areas.mjs decides what the change needs
  # (the same rule is used by hand), and when it cannot tell what changed it says to run everything. The job itself always runs and only skips its steps, so it can stay
  # a required check and finishes in seconds when there is nothing to check.
  #   visual: contrast, layout and the sign-in page. flows: the roles script, with its contrast and layout part only when something visual changed too.
  contrast:
    name: UI checks (contrast and layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the rule needs the history to see what changed
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: What changed
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changed-areas.mjs "${BASE:-none}" | tee -a "$GITHUB_OUTPUT"
      - name: Nothing for the browser checks to do
        if: steps.areas.outputs.visual != 'true' && steps.areas.outputs.flows != 'true'
        run: |
          echo "No visual, screen or server change: contrast, layout and the roles script are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        if: steps.areas.outputs.flows == 'true'
        run: npm ci
      - name: Build
        if: steps.areas.outputs.flows == 'true'
        run: npm run build
      - name: Start Testbench (no password)
        if: steps.areas.outputs.visual == 'true'
        run: |
          NODE_ENV=production TESTBENCH_DATA="$RUNNER_TEMP/data" TESTBENCH_AUTO_BACKUP=0 TESTBENCH_PORT=4100 \
            nohup npx tsx server/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4100/api/auth/status >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Check the app pages
        if: steps.areas.outputs.visual == 'true'
        run: CONTRAST_SEED=1 npm run check:contrast -- http://127.0.0.1:4100
      # Laptop, tablet and phone widths: no sideways scrolling, a readable list, no overlapping top bars, a working menu on phones.
      - name: Check the layout at different screen widths
        if: steps.areas.outputs.visual == 'true'
        run: npm run check:layout -- http://127.0.0.1:4100
      - name: Start a second instance with a password
        if: steps.areas.outputs.visual == 'true'
        run: |
          NODE_ENV=production TESTBENCH_DATA="$RUNNER_TEMP/data2" TESTBENCH_AUTO_BACKUP=0 TESTBENCH_PORT=4101 TESTBENCH_PASSWORD="ci-password-1234" \
            nohup npx tsx server/index.ts > "$RUNNER_TEMP/server2.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4101/api/auth/status >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server2.log"; exit 1
      - name: Check the sign-in page
        if: steps.areas.outputs.visual == 'true'
        run: CONTRAST_ONLY=/login npm run check:contrast -- http://127.0.0.1:4101
      # Roles: a third, empty instance gets accounts and people with each role, and the screens are checked as each of them (labels, buttons that are off, settings tabs, the
      # members page), then contrast and layout as a viewer and as an admin. The checks above run on an instance without accounts, so they never see any of this.
      - name: Start a third instance for accounts and roles
        if: steps.areas.outputs.flows == 'true'
        run: |
          NODE_ENV=production TESTBENCH_DATA="$RUNNER_TEMP/data3" TESTBENCH_AUTO_BACKUP=0 TESTBENCH_PORT=4102 \
            nohup npx tsx server/index.ts > "$RUNNER_TEMP/server3.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4102/api/auth/status >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server3.log"; exit 1
      - name: Check the screens of roles
        if: steps.areas.outputs.flows == 'true'
        env:
          ROLES_SKIP_VISUAL: ${{ steps.areas.outputs.visual == 'true' && '0' || '1' }} # contrast and layout as a viewer and an admin only when something visual changed
        run: npm run check:roles -- http://127.0.0.1:4102

  docker:
    name: Docker image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t testbench:ci .
      # Starts the image and checks the login, the web app, the database and a PDF report.
      - name: Smoke test the image
        run: bash scripts/docker-smoke.sh testbench:ci
