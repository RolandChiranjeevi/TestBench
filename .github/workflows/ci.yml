name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Known vulnerabilities in what ships. Reported but not blocking: a new advisory should not fail an unrelated change.
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    name: Docker image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t testbench:ci .
      # Starts the image and checks the login, the web app, the database and a PDF report.
      - name: Smoke test the image
        run: bash scripts/docker-smoke.sh testbench:ci
