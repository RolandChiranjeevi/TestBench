# What Dependabot keeps up to date, and how loudly. See docs/repo-hygiene.md.
# Once a month, and in a group per kind of update, so that a month of small updates is one pull request and not twelve. Security updates are separate: they come when an advisory is published, and this does not hold them back.
# The Python tools in testpilot/ use only the standard library, so there is nothing to update there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
